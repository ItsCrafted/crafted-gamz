<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="favicon.png" />
<title>Crafted Gamz | Versions</title>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: transparent;
    color: white;
    overflow-x: hidden;
  }

  iframe {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    border: none;
    pointer-events: none;
  }

  .content {
    max-width: 1200px;
    margin: 110px auto 60px;
    padding: 30px 40px;
    background: rgba(0, 0, 0, 0.8);
    border-radius: 14px;
    border: 3px solid #4bf9ed;
    box-shadow: 0 0 30px #4bf9ed88;
    line-height: 1.6;
  }

  h1 {
    text-align: center;
    font-size: 3rem;
    margin-bottom: 2rem;
    color: #4bf9ed;
    text-shadow: 0 0 8px #4bf9ed99;
  }

  .subtitle {
    text-align: center;
    font-size: 1.2rem;
    color: #a0f9ffcc;
    margin-bottom: 3rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }

  .subtitle i {
    color: #4bf9ed;
    font-size: 1.4rem;
  }

  .versions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    margin-top: 2rem;
  }

  .version-card {
    background: linear-gradient(135deg, rgba(75, 249, 237, 0.15), rgba(0, 255, 229, 0.08));
    border: 2px solid #4bf9ed;
    border-radius: 16px;
    padding: 30px 25px;
    text-align: center;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 15px rgba(75, 249, 237, 0.2);
  }

  .version-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(75, 249, 237, 0.1), transparent);
    transition: left 0.5s ease;
  }

  .version-card:hover::before {
    left: 100%;
  }

  .version-card:hover {
    transform: translateY(-8px);
    box-shadow: 0 15px 35px rgba(75, 249, 237, 0.4);
    border-color: #00ffe5;
    background: linear-gradient(135deg, rgba(75, 249, 237, 0.2), rgba(0, 255, 229, 0.12));
  }

  .version-number {
    font-size: 3rem;
    font-weight: 900;
    color: #4bf9ed;
    margin-bottom: 20px;
    text-shadow: 0 0 15px #4bf9ed99;
    letter-spacing: -2px;
  }

  .version-link {
    display: inline-block;
    padding: 14px 28px;
    background: linear-gradient(45deg, #4bf9ed, #00ffe5);
    color: #000;
    text-decoration: none;
    border-radius: 30px;
    font-weight: bold;
    font-size: 1rem;
    transition: all 0.3s ease;
    position: relative;
    z-index: 1;
    box-shadow: 0 4px 12px rgba(75, 249, 237, 0.3);
  }

  .version-link:hover {
    transform: scale(1.08);
    box-shadow: 0 8px 20px rgba(75, 249, 237, 0.6);
    color: #000;
  }

  .status-indicator {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 10px 18px;
    border-radius: 25px;
    font-size: 0.95rem;
    font-weight: 600;
    position: relative;
    z-index: 1;
    backdrop-filter: blur(5px);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }

  .status-online {
    background: rgba(34, 197, 94, 0.2);
    border: 1px solid #22c55e;
    color: #22c55e;
  }

  .status-offline {
    background: rgba(239, 68, 68, 0.2);
    border: 1px solid #ef4444;
    color: #ef4444;
  }

  .status-loading {
    background: rgba(168, 85, 247, 0.2);
    border: 1px solid #a855f7;
    color: #a855f7;
  }

  .status-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: currentColor;
    animation: pulse 2s infinite;
    box-shadow: 0 0 8px currentColor;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .current-version {
    position: relative;
  }

  .current-version::after {
    content: 'CURRENT';
    position: absolute;
    top: -5px;
    right: -5px;
    background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
    color: white;
    padding: 5px 10px;
    border-radius: 15px;
    font-size: 0.7rem;
    font-weight: bold;
    box-shadow: 0 2px 8px rgba(255, 107, 107, 0.4);
  }

  @media (max-width: 768px) {
    .versions-grid {
      grid-template-columns: 1fr;
      gap: 15px;
    }
    
    .content {
      margin: 90px auto 40px;
      padding: 20px 25px;
    }
    
    h1 {
      font-size: 2.5rem;
    }
  }
</style>
<script src="status.js"></script>
</head>
