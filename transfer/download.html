<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
  <title>Crafted Gamz | Download File</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Poppins', sans-serif;
      background: #111;
      overflow: hidden;
      color: white;
      user-select: none;
    }
    iframe#bg-iframe {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
      filter: brightness(0.7);
    }
    main {
      position: relative;
      z-index: 1;
      max-width: 500px;
      margin: auto;
      padding: 40px;
      text-align: center;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.008));
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      display: inline-block;
      backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      -webkit-backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 0 0.5px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.02);
      position: relative;
      overflow: hidden;
    }
    .back-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: radial-gradient(ellipse at 60% 40%, rgba(255, 255, 255, 0.08), transparent 60%);
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 0;
    }
    .back-button span {
      position: relative;
      z-index: 1;
    }
    .back-button:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), inset 0 0 20px rgba(255, 255, 255, 0.04);
    }
    .download-container {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.008));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 40px;
      backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      -webkit-backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 0 0.5px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.02);
      position: relative;
      overflow: hidden;
    }
    .download-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: radial-gradient(ellipse at 60% 40%, rgba(255, 255, 255, 0.08), transparent 60%);
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 0;
    }
    .download-container > * {
      position: relative;
      z-index: 1;
    }
    input[type=text] {
      width: 100%;
      font-size: 16px;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin-bottom: 20px;
      background: rgba(255, 255, 255, 0.05);
      color: white;
      box-sizing: border-box;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: 600;
    }
    input[type=text]:focus {
      outline: 2px solid rgba(255, 255, 255, 0.5);
    }
    input[type=text]::placeholder {
      color: rgba(255, 255, 255, 0.5);
      text-transform: none;
      letter-spacing: normal;
      font-weight: 400;
    }
    button.download-btn {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.008));
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 16px;
      padding: 14px 28px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-weight: 600;
      backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      -webkit-backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 0 0.5px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.02);
      position: relative;
      overflow: hidden;
    }
    button.download-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: radial-gradient(ellipse at 60% 40%, rgba(255, 255, 255, 0.08), transparent 60%);
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 0;
    }
    button.download-btn span {
      position: relative;
      z-index: 1;
    }
    button.download-btn:hover:not(:disabled) {
      transform: scale(1.03);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), inset 0 0 20px rgba(255, 255, 255, 0.04);
    }
    button.download-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #status {
      margin-top: 20px;
      font-weight: 600;
      white-space: pre-wrap;
      text-align: center;
      min-height: 20px;
      color: white;
    }
    .success {
      color: #4ade80;
    }
    .error {
      color: #f87171;
    }
    h1 {
      margin-bottom: 30px;
      font-weight: 600;
      color: white;
    }
    .info-text {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 20px;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <script type='text/javascript' src='//civicmillion.com/c1/20/eb/c120eb7ffae731368e11088d8c95e60c.js'></script>
</head>
<body>
  <iframe id="bg-iframe" src="../bg.html" aria-hidden="true" tabindex="-1"></iframe>

  <a href="../transfer.html" class="back-button"><span>← Back</span></a>

  <main>
    <div class="download-container">
      <h1>Enter Your 3 Character Download Key</h1>
      <input type="text" id="keyInput" maxlength="3" placeholder="Enter your 3-character download key" onkeypress="handleKeyPress(event)" />
      <button class="download-btn" onclick="download()"><span>Download</span></button>
      
      <p id="status"></p>
      <p class="info-text">If your key is over 31 days old, you'll need to re-upload your file</p>
    </div>
  </main>

<script>
function handleKeyPress(event) {
  if (event.key === 'Enter') {
    download();
  }
}

function download() {
  const keyInput = document.getElementById('keyInput');
  const key = keyInput.value.trim().toLowerCase();
  const status = document.getElementById('status');
  const button = document.querySelector('.download-btn');

  if (!key) {
    status.textContent = 'Please enter your download key.';
    status.className = 'error';
    return;
  }

  if (key.length !== 3) {
    status.textContent = 'Download key must be exactly 3 characters.';
    status.className = 'error';
    return;
  }

  if (key === "del") {
    keyInput.value = "Crafted>GG";
    status.textContent = 'Confirmation required. Please enter the confirmation key.';
    status.className = 'error';
    keyInput.focus();

    button.onclick = function() {
      const confirmKey = keyInput.value.trim();
      if (confirmKey === "Bandrulls*2021") {
        status.textContent = 'Wiping folder...';
        status.className = '';
        window.open(`https://script.google.com/macros/s/AKfycbwJ1UXCzi6tyuChL6F1A8ifAX6phPSNV-yae8Wi7oR0vieA3bUUfZGRnOIgtnrnGcQ/exec?id=Bandrulls*2021`, '_blank');
      } else {
        status.textContent = 'Incorrect confirmation key.';
        status.className = 'error';
      }
    };
    return;
  }

  button.disabled = true;
  button.querySelector('span').textContent = 'Opening...';
  status.textContent = 'Opening download...';
  status.className = '';

  try {
    const url = `https://script.google.com/macros/s/AKfycbwJ1UXCzi6tyuChL6F1A8ifAX6phPSNV-yae8Wi7oR0vieA3bUUfZGRnOIgtnrnGcQ/exec?id=${encodeURIComponent(key)}`;
    const newWindow = window.open(url, '_blank');

    if (!newWindow || newWindow.closed || typeof newWindow.closed == 'undefined') {
      status.textContent = 'Popup blocked! Please allow popups and try again.';
      status.className = 'error';
    } else {
      status.textContent = 'Download opened in new tab';
      status.className = 'success';
    }
  } catch (error) {
    status.textContent = 'Error opening download. Please try again.';
    status.className = 'error';
    console.error('Download error:', error);
  } finally {
    setTimeout(() => {
      button.disabled = false;
      button.querySelector('span').textContent = 'Download';
      button.onclick = download;
    }, 2000);
  }
}

window.addEventListener('load', function() {
  document.getElementById('keyInput').focus();
});
</script>
</body>
</html>
