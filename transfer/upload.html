<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="../favicon.png" type="image/x-icon">
  <title>Crafted Gamz | Upload File</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Poppins', sans-serif;
      background: #111;
      overflow: hidden;
      color: white;
      user-select: none;
    }
    iframe#bg-iframe {
      position: fixed;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      z-index: 0;
      pointer-events: none;
      opacity: 0.6;
      filter: brightness(0.7);
    }
    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.008));
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 14px;
      padding: 12px 20px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-decoration: none;
      display: inline-block;
      z-index: 2;
      backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      -webkit-backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 0 0.5px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.02);
      position: relative;
      overflow: hidden;
    }
    .back-button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: radial-gradient(ellipse at 60% 40%, rgba(255, 255, 255, 0.08), transparent 60%);
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 0;
    }
    .back-button span {
      position: relative;
      z-index: 1;
    }
    .back-button:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), inset 0 0 20px rgba(255, 255, 255, 0.04);
    }
    main {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 40px;
      max-width: 500px;
      margin: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .upload-container {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.008));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 40px;
      backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      -webkit-backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 0 0.5px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.02);
      position: relative;
      overflow: hidden;
    }
    .upload-container::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: radial-gradient(ellipse at 60% 40%, rgba(255, 255, 255, 0.08), transparent 60%);
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 0;
    }
    .upload-container > * {
      position: relative;
      z-index: 1;
    }
    input[type=file] {
      width: 100%;
      font-size: 16px;
      padding: 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      margin: 20px 0;
      background: rgba(255, 255, 255, 0.05);
      color: white;
      box-sizing: border-box;
      cursor: pointer;
    }
    input[type=file]:focus {
      outline: 2px solid rgba(255, 255, 255, 0.5);
    }
    input[type=file]::file-selector-button {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 15px;
      cursor: pointer;
      margin-right: 12px;
    }
    input[type=file]::file-selector-button:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    button {
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.008));
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: white;
      font-size: 16px;
      padding: 14px 28px;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.25s ease;
      font-weight: 600;
      backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      -webkit-backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 0 0.5px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.02);
      position: relative;
      overflow: hidden;
    }
    button::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: radial-gradient(ellipse at 60% 40%, rgba(255, 255, 255, 0.08), transparent 60%);
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 0;
    }
    button span {
      position: relative;
      z-index: 1;
    }
    button:hover:not(:disabled) {
      transform: scale(1.03);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), inset 0 0 20px rgba(255, 255, 255, 0.04);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #result {
      margin-top: 20px;
      font-weight: 600;
      white-space: pre-wrap;
      text-align: center;
      min-height: 20px;
      color: white;
    }
    .loading-spinner {
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid white;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-left: 8px;
    }
    #copyBtn {
      margin-top: 12px;
      display: none;
    }
    h1 {
      margin-bottom: 30px;
      font-weight: 600;
      color: white;
    }
    .file-info {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 10px;
    }
    .info-text {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.7);
      margin-top: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
    <script type='text/javascript' src='//civicmillion.com/c1/20/eb/c120eb7ffae731368e11088d8c95e60c.js'></script>
</head>
<body>
  <iframe id="bg-iframe" src="../bg.html" aria-hidden="true" tabindex="-1"></iframe>

  <a href="../transfer.html" class="back-button"><span>← Back</span></a>

  <main>
    <div class="upload-container">
      <h1>Upload a File</h1>
      <input type="file" id="fileInput" onchange="showFileInfo()" />
      <div id="fileInfo" class="file-info"></div>
      <br />
      <button id="uploadBtn" onclick="upload()"><span>Upload</span></button>
      <p id="result"></p>
      <button id="copyBtn" onclick="copyKey()"><span>Copy Key</span></button>
      <p class="info-text">Uploaded files will be stored for 31 days, then deleted</p>
      <p class="info-text">Maximum file size: 5 GB</p>
    </div>
  </main>

  <script>
    let lastKey = "";
    const MAX_FILE_SIZE = 5 * 1024 * 1024 * 1024; 

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    function showFileInfo() {
      const fileInput = document.getElementById('fileInput');
      const fileInfo = document.getElementById('fileInfo');
      const result = document.getElementById('result');
      
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const fileSize = formatFileSize(file.size);
        fileInfo.textContent = `Selected: ${file.name} (${fileSize})`;
        
        result.textContent = '';
        result.style.color = "white";
      } else {
        fileInfo.textContent = '';
      }
    }

    async function upload() {
      const file = document.getElementById('fileInput').files[0];
      if (!file) {
        const result = document.getElementById('result');
        result.textContent = "Please choose a file first";
        result.style.color = "#f87171";
        return;
      }

      if (file.size > MAX_FILE_SIZE) {
        const result = document.getElementById('result');
        result.textContent = `File too large! Maximum size is 5 GB. Your file is ${formatFileSize(file.size)}.`;
        result.style.color = "#f87171";
        return;
      }

      const uploadBtn = document.getElementById('uploadBtn');
      const result = document.getElementById('result');
      const copyBtn = document.getElementById('copyBtn');

      uploadBtn.disabled = true;
      uploadBtn.querySelector('span').textContent = 'Uploading...';
      copyBtn.style.display = 'none';
      result.innerHTML = 'Uploading <span class="loading-spinner"></span>';
      result.style.color = "white";

      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result.split(',')[1];
        try {
          const res = await fetch('https://script.google.com/macros/s/AKfycbwJ1UXCzi6tyuChL6F1A8ifAX6phPSNV-yae8Wi7oR0vieA3bUUfZGRnOIgtnrnGcQ/exec', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `filedata=${encodeURIComponent(base64)}&mimeType=${encodeURIComponent(file.type)}&filename=${encodeURIComponent(file.name)}`
          });
          if (!res.ok) throw new Error('Upload failed');
          const key = await res.text();
          lastKey = key;
          result.innerHTML = `✅ Upload complete!<br>Your download key: <b>${key}</b>`;
          result.style.color = "#4ade80";
          copyBtn.style.display = 'inline-block';
        } catch(e) {
          result.textContent = "❌ Upload failed. Please try again.";
          result.style.color = "#f87171";
          console.error('Upload error:', e);
        } finally {
          uploadBtn.disabled = false;
          uploadBtn.querySelector('span').textContent = 'Upload';
        }
      };
      reader.readAsDataURL(file);
    }

    function copyKey() {
      if (!lastKey) return;
      navigator.clipboard.writeText(lastKey).then(() => {
        const copyBtn = document.getElementById('copyBtn');
        const originalText = copyBtn.querySelector('span').textContent;
        copyBtn.querySelector('span').textContent = "Copied!";
        setTimeout(() => {
          copyBtn.querySelector('span').textContent = originalText;
        }, 1500);
      }).catch(err => {
        console.error('Copy failed:', err);
        
        const textArea = document.createElement('textarea');
        textArea.value = lastKey;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        
        const copyBtn = document.getElementById('copyBtn');
        const originalText = copyBtn.querySelector('span').textContent;
        copyBtn.querySelector('span').textContent = "Copied!";
        setTimeout(() => {
          copyBtn.querySelector('span').textContent = originalText;
        }, 1500);
      });
    }

    window.addEventListener('load', function() {
      document.getElementById('fileInput').focus();
    });
  </script>
</body>
</html>
