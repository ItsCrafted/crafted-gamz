name = "ccloud"
main = "src/index.js"
compatibility_date = "2024-01-01"

[vars]
ENVIRONMENT = "production"

# Firebase configuration - set these in wrangler secret or environment
# Run: wrangler secret put FIREBASE_API_KEY
# Run: wrangler secret put FIREBASE_PROJECT_ID

# Assets configuration for serving static files
[assets]
directory = "./public"
binding = "ASSETS"
