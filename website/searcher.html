<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Searcher</title>
<link rel="stylesheet" href="css/searcher.css">
</head>
<body>
    <div id="loading">
        <div id="loadingTitle">Grabbing that for you<span class="dots"></span></div>
        <div id="loadingSubtext">Initializing proxy...</div>
    </div>
    <div id="error"></div>
    <iframe id="bgFrame" src="hyperspeed/bg.html"></iframe>
    <iframe id="proxyFrame"></iframe>

    <script src="/baremux/index.js"></script>
    <script src="/uv/uv.bundle.js"></script>
    <script src="/uv/uv.config.js"></script>
    <script src="/sj/scramjet.all.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const query = params.get('q') || params.get('query');
        const wisp = params.get('wisp') || 'wss://pale-pen-crafted-gamz-b0390771.koyeb.app/';
        const backend = params.get('backend') || params.get('proxy') || 'ultraviolet';

        const proxyFrame = document.getElementById('proxyFrame');
        const bgFrame = document.getElementById('bgFrame');
        const errorDiv = document.getElementById('error');
        const loadingDiv = document.getElementById('loading');

        const SCRAMJET_DB_NAME = '$scramjet';
        const SCRAMJET_REQUIRED_STORES = [
            'config',
            'cookies',
            'redirectTrackers',
            'referrerPolicies',
            'publicSuffixList',
        ];

        let connection;
        let scramjet;
        let scramjetFrame;
        let isInitialized = false;

        function showError(message) {
            console.error(message);
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function hideLoading() {
            loadingDiv.style.display = 'none';
        }

        function updateLoadingText(text) {
            document.getElementById('loadingSubtext').textContent = text;
        }

        async function waitForLibraries() {
            let attempts = 0;
            while (!window.BareMux && attempts < 50) {
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }
            
            if (!window.BareMux) {
                throw new Error('BareMux library failed to load');
            }
            
            console.log('BareMux loaded successfully');
        }

        async function initBareMux() {
            try {
                updateLoadingText('Setting up BareMux...');
                
                if (!window.BareMux) {
                    throw new Error('BareMux not loaded');
                }
                
                connection = new BareMux.BareMuxConnection("/baremux/worker.js");
                
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                updateLoadingText('Connecting to transport...');
                
                const transports = [
                    { path: "/libcurl/index.mjs", name: "libcurl", config: [{ wisp: wisp }] }
                ];
                
                let transportSet = false;
                let lastError = null;
                
                for (const transport of transports) {
                    try {
                        console.log(`Attempting to set transport: ${transport.name} at ${transport.path}`);
                        await connection.setTransport(transport.path, transport.config);
                        
                        await new Promise(resolve => setTimeout(resolve, 500));
                        
                        const currentTransport = await connection.getTransport();
                        if (currentTransport) {
                            console.log(`✓ BareMux initialized with ${transport.name}:`, wisp);
                            transportSet = true;
                            break;
                        }
                    } catch (e) {
                        console.warn(`✗ ${transport.name} failed:`, e);
                        lastError = e;
                    }
                }
                
                if (!transportSet) {
                    throw new Error('All transport methods failed. ' + (lastError ? lastError.message : 'Check if /search/libcurl/index.mjs exists'));
                }
                
                console.log('BareMux connection ready');
                return true;
            } catch (e) {
                showError("BareMux initialization failed: " + e.message);
                console.error("BareMux init error:", e);
                return false;
            }
        }

        function waitForRegistrationActive(registration, timeout = 10000) {
            if (registration.active) {
                return Promise.resolve(registration);
            }

            const worker = registration.installing || registration.waiting;
            if (!worker) {
                return Promise.resolve(registration);
            }

            return new Promise((resolve, reject) => {
                const timer = setTimeout(() => {
                    worker.removeEventListener('statechange', onStateChange);
                    reject(new Error('Service worker timeout'));
                }, timeout);

                function onStateChange() {
                    if (worker.state === 'activated') {
                        clearTimeout(timer);
                        worker.removeEventListener('statechange', onStateChange);
                        resolve(registration);
                    }
                }

                worker.addEventListener('statechange', onStateChange);
            });
        }

        function openIndexedDb(name, version) {
            return new Promise((resolve, reject) => {
                const request = typeof version === 'number'
                    ? indexedDB.open(name, version)
                    : indexedDB.open(name);

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error || new Error(`Failed to open IndexedDB database: ${name}`));
                request.onblocked = () => reject(new Error(`IndexedDB open blocked for ${name}`));
            });
        }

        function deleteIndexedDb(name) {
            return new Promise((resolve, reject) => {
                const request = indexedDB.deleteDatabase(name);
                request.onsuccess = () => resolve(true);
                request.onerror = () => reject(request.error || new Error(`Failed to delete IndexedDB database: ${name}`));
                request.onblocked = () => reject(new Error(`IndexedDB delete blocked for ${name}`));
            });
        }

        async function repairScramjetDatabase() {
            if (!('indexedDB' in window)) {
                return;
            }

            let db;
            try {
                db = await openIndexedDb(SCRAMJET_DB_NAME);
            } catch (e) {
                console.warn('Unable to inspect Scramjet database before init:', e);
                return;
            }

            const missingStores = SCRAMJET_REQUIRED_STORES.filter(
                storeName => !db.objectStoreNames.contains(storeName)
            );

            if (missingStores.length === 0) {
                db.close();
                return;
            }

            console.warn('Repairing Scramjet database, missing stores:', missingStores);
            db.close();
            await deleteIndexedDb(SCRAMJET_DB_NAME);
        }

        async function initScramjet() {
            try {
                if (!window.$scramjetLoadController) {
                    console.warn("Scramjet not available");
                    return null;
                }

                const CONFIG = {
                    prefix: "/scramjet/",
                    files: {
                        wasm: "/sj/scramjet.wasm.wasm",
                        all: "/sj/scramjet.all.js",
                        sync: "/sj/scramjet.sync.js",
                    },
                };
                
                const { ScramjetController } = $scramjetLoadController();
                scramjet = new ScramjetController({
                    prefix: CONFIG.prefix,
                    files: CONFIG.files,
                });

                await scramjet.init();
                scramjetFrame = scramjet.createFrame(proxyFrame);
                console.log("Scramjet initialized with prefix:", CONFIG.prefix);
                return scramjet;
            } catch (e) {
                console.error("Scramjet init error:", e);
                return null;
            }
        }

        async function registerSW() {
            if (!("serviceWorker" in navigator)) {
                showError("Service workers not supported in this browser");
                return false;
            }

            try {
                updateLoadingText('Registering service workers...');

                if (backend === 'scramjet') {
                    updateLoadingText('Repairing Scramjet database...');
                    try {
                        await repairScramjetDatabase();
                    } catch (e) {
                        console.warn('Scramjet database repair deferred to service worker:', e);
                    }
                }
                
                if (backend === 'ultraviolet' || backend === 'uv') {
                    const swCheck = await fetch('/uv/sw.js', { method: 'HEAD' }).catch(() => null);
                    if (!swCheck || !swCheck.ok) {
                        throw new Error('UV service worker file not found at /uv/sw.js');
                    }
                    console.log('✓ UV service worker file exists');
                } else if (backend === 'scramjet') {
                    const swCheck = await fetch('/sw.js', { method: 'HEAD' }).catch(() => null);
                    if (!swCheck || !swCheck.ok) {
                        throw new Error('Scramjet service worker file not found at /sw.js');
                    }
                    console.log('✓ Scramjet service worker file exists');
                }
                
                let registration;
                if (backend === 'ultraviolet' || backend === 'uv') {
                    registration = await navigator.serviceWorker.register("/uv/sw.js", {
                        scope: "/uv/"
                    });
                    console.log("UV service worker registered:", registration.scope);
                } else if (backend === 'scramjet') {
                    registration = await navigator.serviceWorker.register("/sw.js", {
                        scope: "/"
                    });
                    console.log("Scramjet service worker registered:", registration.scope);
                }
                
                updateLoadingText('Waiting for service worker...');
                
                const swReady = await Promise.resolve(registration)
                    .then(reg => waitForRegistrationActive(reg, 10000))
                    .catch(e => {
                    console.error('Service worker failed to become ready:', e);
                    return null;
                });
                
                if (!swReady) {
                    console.warn('Service worker not ready, continuing anyway...');
                } else {
                    console.log("Service worker ready:", swReady);
                }

                if (backend === 'scramjet') {
                    updateLoadingText('Activating Scramjet service worker...');

                    if (!navigator.serviceWorker.controller) {
                        await new Promise((resolve) => {
                            navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
                            setTimeout(resolve, 3000);
                        });
                    }
                    
                    console.log('Service worker is now controlling the page');

                    updateLoadingText('Initializing Scramjet...');
                    
                    const scramjetReady = await initScramjet();
                    if (!scramjetReady || !scramjetFrame) {
                        throw new Error('Scramjet controller failed to initialize');
                    }
                } else {
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                return true;
            } catch (e) {
                showError("Service worker setup failed: " + e.message);
                console.error("SW setup error:", e);
                return false;
            }
        }

        async function navigate(url) {
            try {
                updateLoadingText('Preparing to navigate...');

                if (connection) {
                    const transport = await connection.getTransport();
                    if (!transport) {
                        console.log("Reinitializing BareMux...");
                        const success = await initBareMux();
                        if (!success) {
                            showError("Failed to initialize BareMux connection");
                            hideLoading();
                            return;
                        }
                    }
                }
                
                proxyFrame.onload = function() {
                    bgFrame.style.display = 'none';
                    proxyFrame.classList.add('active');
                    hideLoading();
                };

                proxyFrame.onerror = function() {
                    showError("Failed to load proxied page");
                    hideLoading();
                };
                
                if (backend === 'scramjet' && scramjet && scramjetFrame) {
                    console.log("Using Scramjet:", url);
                    scramjetFrame.go(url);
                } else {
                    if (typeof __uv$config === 'undefined') {
                        showError("Ultraviolet config not loaded. Check if /uv/uv.config.js exists.");
                        hideLoading();
                        return;
                    }
                    const proxyUrl = __uv$config.prefix + __uv$config.encodeUrl(url);
                    console.log("Using Ultraviolet:", proxyUrl);
                    proxyFrame.src = proxyUrl;
                }

                updateLoadingText('Loading page...');
                
            } catch (e) {
                showError("Navigation error: " + e.message);
                console.error('Navigation error:', e);
                hideLoading();
            }
        }

        async function init() {
            try {
                await waitForLibraries();
                const swReady = await registerSW();
                if (!swReady) {
                    showError("Service worker registration failed");
                    hideLoading();
                    return;
                }

                updateLoadingText('Initializing BareMux...');
                const bmReady = await initBareMux();
                if (!bmReady) {
                    showError("BareMux initialization failed");
                    hideLoading();
                    return;
                }
                
                isInitialized = true;
                
                if (query) {
                    let url = query.trim();

                    if (!url.includes(".") || url.includes(" ")) {
                        url = "https://duckduckgo.com/?q=" + encodeURIComponent(url);
                    } else {
                        if (!url.startsWith("http://") && !url.startsWith("https://")) {
                            url = "https://" + url;
                        }
                    }
                    
                    console.log("Navigating to:", url);
                    setTimeout(() => navigate(url), 2000);
                } else {
                    hideLoading();
                }
            } catch (e) {
                showError("Initialization error: " + e.message);
                console.error("Init error:", e);
                hideLoading();
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
    <script src="js/loading.js"></script>
</body>
</html>
