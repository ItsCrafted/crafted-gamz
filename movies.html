<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="favicon.png" />
<title>Crafted Gamz | Movies</title>
<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
/>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: transparent;
    color: white;
    overflow-x: hidden;
  }

  iframe {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 2;
    border: none;
  }

  .loading {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    font-size: 18px;
    color: white;
  }

  .error {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1;
    font-size: 18px;
    color: #ff6b6b;
    text-align: center;
    padding: 20px;
  }

</style>
<script src="status.js"></script>
</head>

<body>
  <div id="loading" class="loading">
    <i class="fas fa-spinner fa-spin"></i> Loading...
  </div>
  
  <div id="error" class="error" style="display: none;">
    <i class="fas fa-exclamation-triangle"></i><br>
    Failed to load the application.<br>
    <small>Please try refreshing the page.</small>
  </div>

<script>
async function loadIframe() {
  try {
    
    const response = await fetch('/.netlify/functions/get-movie-url');
    
    if (!response.ok) {
      throw new Error(`HTTP error! status: ${response.status}`);
    }
    
    const data = await response.json();
    
    if (!data.url) {
      throw new Error('No URL returned from function');
    }
    
    
    const iframe = document.createElement('iframe');
    iframe.src = data.url;
    iframe.frameBorder = '0';
    iframe.style.position = 'fixed';
    iframe.style.top = '0';
    iframe.style.left = '0';
    iframe.style.width = '100vw';
    iframe.style.height = '100vh';
    iframe.style.zIndex = '2';
    iframe.style.border = 'none';
    
    
    document.getElementById('loading').style.display = 'none';
    
    
    document.body.appendChild(iframe);
    
  } catch (error) {
    console.error('Error loading iframe:', error);
    
    
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
  }
}


window.addEventListener('DOMContentLoaded', loadIframe);
</script>

<script src="periodSchedule.js"></script>
<script src="nav.js" defer></script>
<script type="module" src="reload.js"></script>
<script type="module" src="disable.js"></script>
<script type="module" src="notification.js"></script>
<script type="module" src="maintenance.js"></script>


</body>
</html>
