<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crafted Gamz</title>
  <link rel="shortcut icon" href="favicon.png" type="image/x-icon">
  <script src="playtime-tracker.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: black;
    }

    #bgFrame {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      z-index: 0;
    }

    #launchBtn {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.008));
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: white;
      padding: 1.2rem 2.5rem;
      font-size: 1.5rem;
      border-radius: 25px;
      cursor: pointer;
      z-index: 10;
      backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      -webkit-backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 0 0.5px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.02);
      transition: all 0.25s ease;
      font-weight: 600;
      position: relative;
      overflow: hidden;
    }

    #launchBtn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: radial-gradient(ellipse at 60% 40%, rgba(255, 255, 255, 0.08), transparent 60%);
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 0;
    }

    #launchBtn:hover:not(:disabled) {
      transform: translate(-50%, -50%) scale(1.03);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), inset 0 0 20px rgba(255, 255, 255, 0.04);
    }

    #launchBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #gameFrame {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      border: none;
      display: none;
      opacity: 0;
      z-index: 2;
      transition: opacity 0.6s ease-in;
    }

    .transition-box {
      position: absolute;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.008));
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      -webkit-backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 0 0.5px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.02);
      border-radius: 25px;
      z-index: 10;
      overflow: hidden;
    }

    .transition-box::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: radial-gradient(ellipse at 60% 40%, rgba(255, 255, 255, 0.08), transparent 60%);
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 0;
    }

    #bar {
      position: absolute;
      bottom: 10px;
      left: 30px;
      right: 30px;
      height: 50px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.008));
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 25px;
      backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      -webkit-backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 0 0.5px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.02);
      display: flex;
      align-items: center;  
      justify-content: space-between;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      padding: 0 20px;
      opacity: 0;
      z-index: 20;
      user-select: none;
      pointer-events: none;
      transition: opacity 0.4s ease;
      overflow: hidden;
    }

    #bar::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: radial-gradient(ellipse at 60% 40%, rgba(255, 255, 255, 0.08), transparent 60%);
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 0;
    }

    #bar > * {
      position: relative;
      z-index: 1;
    }

    #bar.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #bar .button-group {
      display: flex;
      gap: 12px;
      align-items: center;  
    }

    #bar .title {
      display: flex;
      align-items: center;  
      height: 100%;
      color: white;
    }

    #bar button {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      border-radius: 15px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      line-height: 1;
      transition: all 0.25s ease;
    }

    #bar button:hover {
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-1px);
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
    }
  </style>
  <script type='text/javascript' src='//civicmillion.com/c1/20/eb/c120eb7ffae731368e11088d8c95e60c.js'></script>
</head>
<body>
  <iframe id="bgFrame" src="bg.html"></iframe>
  <button id="launchBtn">Launch</button>
  <iframe id="gameFrame"></iframe>

  <div id="bar" aria-label="Game controls bar" role="region" aria-live="polite">
    <div class="title left-title"></div>
    <div class="button-group">
      <button id="reloadBtn" aria-label="Reload game iframe">Reload</button>
      <button id="homeBtn" aria-label="Go to home page">Home</button>
      <button id="backBtn" aria-label="Go to games page">Back</button>
      <button id="fullscreenBtn" aria-label="Toggle fullscreen">Fullscreen</button>
    </div>
    <div class="title right-title"></div>
  </div>

  <script src="gameconfigs.js"></script>
  <script>
    const gameId = (JSON.parse(localStorage.getItem('gameIds') || '[]')[0]) || null;
    const config = gameConfigs[gameId] || null;

    if (config) {
      document.title = config.title;  
    }

    const launchBtn = document.getElementById('launchBtn');
    const gameFrame = document.getElementById('gameFrame');
    const bar = document.getElementById('bar');
    const leftTitle = bar.querySelector('.left-title');
    const rightTitle = bar.querySelector('.right-title');
    const reloadBtn = document.getElementById('reloadBtn');
    const homeBtn = document.getElementById('homeBtn');
    const backBtn = document.getElementById('backBtn');
    const fullscreenBtn = document.getElementById('fullscreenBtn');

    if (config) {
      launchBtn.textContent = `Launch ${config.title}`;
      leftTitle.textContent = config.title;
      rightTitle.textContent = config.title;
    } else {
      launchBtn.textContent = 'Invalid Game ID';
      launchBtn.disabled = true;
    }

    launchBtn.addEventListener('click', () => {
      const rect = launchBtn.getBoundingClientRect();
      const box = document.createElement('div');

      launchBtn.textContent = '';
      box.className = 'transition-box';
      box.style.width = `${rect.width}px`;
      box.style.height = `${rect.height}px`;
      box.style.left = `${rect.left}px`;
      box.style.top = `${rect.top}px`;
      document.body.appendChild(box);
      launchBtn.style.display = 'none';

      const startWidth = rect.width;
      const startHeight = rect.height;
      const targetSize = 60;
      const centerY = rect.top + startHeight / 2;
      const centerX = rect.left + startWidth / 2;

      let progress = 0;

      const shrink = setInterval(() => {
        progress += 0.025;
        if (progress >= 1) {
          clearInterval(shrink);
          box.style.width = `${targetSize}px`;
          box.style.height = `${targetSize}px`;
          box.style.left = `${centerX - targetSize / 2}px`;
          box.style.top = `${centerY - targetSize / 2}px`;
          box.style.borderRadius = '50%';
          setTimeout(() => driftDown(box), 300);
        } else {
          const eased = 1 - Math.pow(1 - progress, 3);
          const currentWidth = startWidth - (startWidth - targetSize) * eased;
          const currentHeight = startHeight - (startHeight - targetSize) * eased;
          box.style.width = `${currentWidth}px`;
          box.style.height = `${currentHeight}px`;
          box.style.left = `${centerX - currentWidth / 2}px`;
          box.style.top = `${centerY - currentHeight / 2}px`;
          const radiusPercent = (targetSize / Math.max(currentWidth, currentHeight)) * 100;
          box.style.borderRadius = `${radiusPercent}%`;
        }
      }, 12);

      function driftDown(box) {
        const targetY = window.innerHeight - 10 - parseFloat(box.style.height);
        let currentTop = parseFloat(box.style.top);
        let totalDistance = targetY - currentTop;
        let progress = 0;

        const drift = setInterval(() => {
          progress += 0.015;
          if (progress >= 1) {
            clearInterval(drift);
            box.style.top = `${targetY}px`;
            box.style.borderRadius = '25px';
            expandOverlay(box);
          } else {
            const eased = 1 - Math.pow(1 - progress, 3);
            const newTop = currentTop + totalDistance * eased;
            box.style.top = `${newTop}px`;
          }
        }, 10);
      }

      function expandOverlay(box) {
        const margin = 30;
        const targetLeft = margin;
        const targetRight = window.innerWidth - margin;
        const targetWidth = targetRight - targetLeft;

        let initialLeft = parseFloat(box.style.left);
        let initialWidth = parseFloat(box.style.width);
        let totalLeftChange = initialLeft - targetLeft;
        let totalWidthChange = targetWidth - initialWidth;
        let progress = 0;

        const expand = setInterval(() => {
          progress += 0.015;
          if (progress >= 1) {
            clearInterval(expand);
            box.style.left = `${targetLeft}px`;
            box.style.width = `${targetWidth}px`;
            loadGame(box);
            box.remove();  
          } else {
            const eased = 1 - Math.pow(1 - progress, 3);
            const newLeft = initialLeft - totalLeftChange * eased;
            const newWidth = initialWidth + totalWidthChange * eased;
            box.style.left = `${newLeft}px`;
            box.style.width = `${newWidth}px`;
          }
        }, 10);
      }

      function loadGame(box) {
        gameFrame.src = `games/${config.url}/index.html`;
        gameFrame.style.display = 'block';
        setTimeout(() => {
          gameFrame.style.opacity = 1;
          bar.classList.add('visible');
        }, 100);
      }
    });

    reloadBtn.addEventListener('click', () => {
      if (gameFrame.src) {
        gameFrame.contentWindow.location.reload();
      }
    });

    homeBtn.addEventListener('click', () => {
      window.location.href = 'main.html';
    });

    backBtn.addEventListener('click', () => {
      window.location.href = 'g.html';
    });

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          bar.style.display = 'none';
        }).catch(() => {});
      } else {
        document.exitFullscreen().then(() => {
          bar.style.display = 'flex';
        }).catch(() => {});
      }
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        bar.style.display = 'flex';
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => {
        console.log('SW registration failed:', err);
      });
    }
  </script>
  <script>
(function() {
  let firebaseApp;
  let rtdb;

  async function loadFirebaseConfig() {
    try {
      const res = await fetch('/.netlify/functions/get-firebase-config');
      if (!res.ok) throw new Error('Failed to fetch Firebase config');
      const config = await res.json();
      return config;
    } catch (error) {
      console.error('Error loading Firebase config:', error);
      throw error;
    }
  }

  async function initializeOnlineTracking() {
    try {
      if (typeof firebase === 'undefined') {
        await loadFirebaseSDK();
      }

      const config = await loadFirebaseConfig();
      firebaseApp = firebase.initializeApp(config);
      rtdb = firebase.database();
      await trackRealtimeOnline();
    } catch (error) {
      console.error('Failed to initialize online tracking:', error);
    }
  }

  function loadFirebaseSDK() {
    return new Promise((resolve, reject) => {
      if (typeof firebase !== 'undefined') {
        resolve();
        return;
      }

      const appScript = document.createElement('script');
      appScript.src = 'https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js';
      appScript.onload = () => {
        const dbScript = document.createElement('script');
        dbScript.src = 'https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js';
        dbScript.onload = () => resolve();
        dbScript.onerror = () => reject(new Error('Failed to load Firebase Database SDK'));
        document.head.appendChild(dbScript);
      };
      appScript.onerror = () => reject(new Error('Failed to load Firebase App SDK'));
      document.head.appendChild(appScript);
    });
  }

  async function trackRealtimeOnline() {
    try {
      const sessionRef = rtdb.ref('onlineUsers').push();
      await sessionRef.set(true);
      sessionRef.onDisconnect().remove();

      rtdb.ref('onlineUsers').on('value', snap => {
        const count = snap.numChildren();
        const onlineCountElement = document.getElementById('online-count');
        if (onlineCountElement) {
          onlineCountElement.textContent = count;
        }
      });
    } catch (error) {
      console.error('Error setting up realtime online tracking:', error);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initializeOnlineTracking);
  } else {
    initializeOnlineTracking();
  }
})();
</script>
<script type="module" src="reload.js"></script>
<script src="time-tracker.js"></script>
<script type="module" src="disable.js"></script>
<script type="module" src="notification.js"></script>
