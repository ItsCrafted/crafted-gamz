  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      font-family: sans-serif;
    }
    
    #bg-iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 0;
    }
    
    #wiki-iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
      pointer-events: none;
    }
    
    #entry-container {
      position: absolute;
      top: 472px;
      left: 931px;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
    }
    
    #entry-box {
      padding: 5px;
      border: 1px solid #ccc;
      width: 385px;
      height: 32px;
      font-size: 16px;
    }
    
    #text-display {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
      font-size: 120px;
      font-weight: 100;
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
      white-space: nowrap;
      color: white;
      text-shadow: 
        0 0 40px rgba(255, 255, 255, 0.8),
        0 0 80px rgba(255, 255, 255, 0.5),
        0 10px 30px rgba(0, 0, 0, 0.3);
      letter-spacing: 12px;
      opacity: 0;
    }
    
    .char {
      display: inline-block !important;
      opacity: 1 !important;
      transform: translateY(0) rotateX(0deg) scale(1) !important;
      animation: charAppear 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
    }
    
    @keyframes charAppear {
      0% {
        opacity: 0;
        transform: translateY(50px) rotateX(90deg) scale(0.3);
      }
      60% {
        opacity: 1;
        transform: translateY(-10px) rotateX(-5deg) scale(1.1);
      }
      100% {
        opacity: 1 !important;
        transform: translateY(0) rotateX(0deg) scale(1) !important;
      }
    }
    
    @keyframes fadeInMain {
      from {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.8);
      }
      to {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
    }
    
    @keyframes shimmer {
      0%, 100% {
        text-shadow: 
          0 0 40px rgba(255, 255, 255, 0.8),
          0 0 80px rgba(255, 255, 255, 0.5),
          0 10px 30px rgba(0, 0, 0, 0.3);
      }
      50% {
        text-shadow: 
          0 0 60px rgba(255, 255, 255, 1),
          0 0 120px rgba(255, 255, 255, 0.7),
          0 10px 40px rgba(0, 0, 0, 0.4);
      }
    }
    
    @keyframes float {
      0%, 100% {
        transform: translate(-50%, -50%) translateY(0px);
      }
      50% {
        transform: translate(-50%, -50%) translateY(-15px);
      }
    }
    
    .final-pulse {
      animation: shimmer 1.5s ease-in-out infinite, float 3s ease-in-out infinite !important;
    }
  </style>
</head>
<body>

<iframe id="bg-iframe" src="bg.html"></iframe>
<iframe id="wiki-iframe" src="https://www.wikipedia.org/" scrolling="no"></iframe>

<div id="text-display"></div>

<div id="entry-container">
  <input type="text" id="entry-box" placeholder="Search Wikipedia" autocomplete="off">
</div>

<audio id="intro-audio" src="intro_p1.mp3" preload="auto"></audio>

<script>
  let secretCode1 = "", secretCode2 = "", redirectURL = "";

  async function fetchPasswords() {
    try {
      const response = await fetch('/.netlify/functions/getPassword');
      const data = await response.json();
      secretCode1 = data.password;
      secretCode2 = data.alternatePassword || ""; 
      redirectURL = data.clientRedirectUrl || "main.html";
    } catch (err) {
      console.error("Failed to fetch password:", err);
    }
  }

  async function main() {
    await fetchPasswords();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => {
        console.log('SW registration failed:', err);
      });
    }
  }

  main();

  const textDisplay = document.getElementById("text-display");
  const audio = document.getElementById("intro-audio");

  let redirected = false;

  function redirectToMain() {
    if (redirectURL && redirectURL.length > 0) {
      window.location.href = redirectURL;
    }
  }

  function handleSubmit() {
    const query = document.getElementById("entry-box").value.trim();
    
    if (query === secretCode1 || query === secretCode2) {
      const playIntro = localStorage.getItem("introEnabled") !== "0";
      
      if (playIntro) {
        startCraftedGamzSequence();
      } else {
        redirectToMain();
      }
    } else {
      window.location.href = `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(query)}`;
    }
    document.getElementById("entry-box").value = "";
  }

  function startCraftedGamzSequence() {
    localStorage.setItem("introPlayed", "1");
    
    audio.play().catch(err => console.warn("Audio play failed:", err));
    
    document.getElementById("wiki-iframe").style.display = "none";
    document.getElementById("entry-container").style.display = "none";
    
    textDisplay.style.display = "block";
    textDisplay.style.animation = "fadeInMain 0.6s ease-out forwards";
    
    const finalText = "CRAFTED GAMZ VERSION #13";
    textDisplay.innerHTML = wrapTextInSpans(finalText);
    
    setTimeout(() => {
      textDisplay.classList.add('final-pulse');
    }, 2500);
    
    setTimeout(() => {
      if (!redirected) {
        redirected = true;
        redirectToMain();
      }
    }, 4500);
  }

  function wrapTextInSpans(text) {
    return text.split('').map((char, index) => {
      if (char === ' ') {
        return '<span class="char" style="animation-delay: ' + (index * 0.08) + 's">&nbsp;</span>';
      }
      return '<span class="char" style="animation-delay: ' + (index * 0.08) + 's">' + char + '</span>';
    }).join('');
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      handleSubmit();
    }
  });

  window.onload = () => {
    const entryBox = document.getElementById("entry-box");
    if (entryBox) {
      entryBox.focus();
    }
  };
</script>

</body>
