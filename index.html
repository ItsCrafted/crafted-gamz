  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(45deg, #050506, #1b4e52);
      font-family: sans-serif;
    }
    iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 0;
      pointer-events: none;
    }
    #entry-container {
      position: absolute;
      top: 472px;
      left: 931px;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 10px;
    }
    #entry-box {
      padding: 5px;
      border: 1px solid #ccc;
      width: 385px;
      height: 32px;
      font-size: 16px;
    }
    #canvas {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 5;
      background: linear-gradient(45deg, #050506, #1b4e52);
    }
  </style>
</head>
<body>

<iframe src="https://www.wikipedia.org/" scrolling="no"></iframe>

<canvas id="canvas"></canvas>

<div id="entry-container">
  <input type="text" id="entry-box" placeholder="Search Wikipedia" autocomplete="off">
</div>

<audio id="intro-audio" src="intro_p1.mp3" preload="auto"></audio>

<script>
  let secretCode1 = "", secretCode2 = "", redirectURL = "";

  async function fetchPasswords() {
    try {
      const response = await fetch('/.netlify/functions/getPassword');
      const data = await response.json();
      secretCode1 = data.password;
      secretCode2 = data.alternatePassword || ""; 
      redirectURL = data.clientRedirectUrl || "main.html";
    } catch (err) {
      console.error("Failed to fetch password:", err);
    }
  }

  async function main() {
    await fetchPasswords();

    window.onload = () => {
      resize();
      document.getElementById("entry-box").focus();
    };

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(err => {
        console.log('SW registration failed:', err);
      });
    }
  }

  main();

  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const audio = document.getElementById("intro-audio");

  let width, height;
  let particles = [];
  let state = "idle";
  let timer = 0;
  let flickerTick = 0;
  let redirected = false;

  const craftedMain = "#00ffe5";
  const text = "Crafted Gamz Version 12";

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }

  function createParticlesFromText(message) {
    particles = [];
    const tempCanvas = document.createElement("canvas");
    const tctx = tempCanvas.getContext("2d");
    tempCanvas.width = width;
    tempCanvas.height = height;
    tctx.font = "bold 80px 'Segoe UI'";
    tctx.fillStyle = "white";
    tctx.textAlign = "center";
    tctx.textBaseline = "middle";
    tctx.fillText(message, width / 2, height / 2);
    const data = tctx.getImageData(0, 0, width, height).data;
    for (let y = 0; y < height; y += 4) {
      for (let x = 0; x < width; x += 4) {
        const i = (x + y * width) * 4;
        if (data[i + 3] > 150) {
          const startX = Math.random() * width;
          const startY = height + Math.random() * 200;
          const cp1 = {
            x: startX + (Math.random() - 0.5) * 200,
            y: height - 200 - Math.random() * 100
          };
          particles.push({
            x: startX, y: startY, startX, startY,
            tx: x, ty: y, cp1, t: 0,
            speed: 0.005 + Math.random() * 0.003,
            color: craftedMain,
            life: 1,
            exploded: false,
            vx: 0, vy: 0
          });
        }
      }
    }
  }

  function bezierPoint(t, p0, p1, p2) {
    const u = 1 - t;
    return u * u * p0 + 2 * u * t * p1 + t * t * p2;
  }

  function resetAnimation() {
    particles = [];
    flickerTick = 0;
    createParticlesFromText(text);
    state = "rising";
    timer = 0;
  }

  function animate() {
    ctx.clearRect(0, 0, width, height);
    if (state === "rising") {
      let allAtTarget = true;
      for (let p of particles) {
        if (p.t < 1) {
          p.t += p.speed;
          if (p.t > 1) p.t = 1;
          p.x = bezierPoint(p.t, p.startX, p.cp1.x, p.tx);
          p.y = bezierPoint(p.t, p.startY, p.cp1.y, p.ty);
          allAtTarget = false;
        } else {
          p.x = p.tx;
          p.y = p.ty;
        }
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 2, 2);
      }
      if (allAtTarget) {
        state = "fuse";
        timer = 180;
      }
    } else if (state === "fuse") {
      flickerTick += 0.05;
      const flickerBlur = 25 + 5 * Math.sin(flickerTick);
      const flickerAlpha = 0.85 + 0.1 * Math.sin(flickerTick + Math.PI / 2);
      ctx.font = "bold 80px 'Segoe UI'";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = craftedMain;
      ctx.shadowColor = craftedMain;
      ctx.shadowBlur = flickerBlur;
      ctx.globalAlpha = flickerAlpha;
      ctx.fillText(text, width / 2, height / 2);
      ctx.globalAlpha = 1;
      timer--;
      if (timer <= 0) {
        state = "explode";
        timer = 180;
      }
    } else if (state === "explode") {
      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        if (!p.exploded) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 10 + Math.random() * 10;
          p.vx = Math.cos(angle) * speed;
          p.vy = Math.sin(angle) * speed - (Math.random() * 5);
          p.exploded = true;
        }
        p.vy -= 0.5;
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.95;
        p.vy *= 0.95;
        p.life -= 0.01;
        if (p.life > 0) {
          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, 2, 2);
          ctx.restore();
        } else {
          particles.splice(i, 1);
        }
      }
      timer--;
      if (timer <= 0 && particles.length === 0 && !redirected) {
        redirected = true;
        if (redirectURL && redirectURL.length > 0) {
          window.location.href = redirectURL;
        } else {
          console.warn("Redirect URL not set.");
        }
      }
    }
    requestAnimationFrame(animate);
  }


  function redirectToMain() {
    if (redirectURL && redirectURL.length > 0) {
      window.location.href = redirectURL;
    } else {
      console.warn("Redirect URL not set.");
    }
  }

function handleSubmit() {
    const query = document.getElementById("entry-box").value.trim();
    if (query === secretCode1 || query === secretCode2) {
        
        const playIntro = localStorage.getItem("introEnabled") !== "0";
        
        if (playIntro) {
            
            startCraftedGamzSequence();
        } else {
            
            redirectToMain();
        }
    } else {
        window.location.href = `https://en.wikipedia.org/wiki/Special:Search?search=${encodeURIComponent(query)}`;
    }
    document.getElementById("entry-box").value = "";
}

function startCraftedGamzSequence() {
    
    localStorage.setItem("introPlayed", "1");
    audio.play().catch(err => console.warn("Audio play failed:", err));
    canvas.style.display = "block";
    document.getElementById("entry-container").style.display = "none";
    resetAnimation();
    animate();
}

  document.addEventListener("keydown", e => {
    if (e.key === "Enter") handleSubmit();
  });

  window.onload = () => {
    resize();
    document.getElementById("entry-box").focus();
  };

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(err => {
      console.log('SW registration failed:', err);
    });
  }
</script>

</body>
</html>
