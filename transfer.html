  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
      background: #111;
    }

    iframe#bg-iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      border: none;
      pointer-events: none;
    }

    main {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding-top: 80px; 
      text-align: center;
    }

    h1 {
      color: white;
      font-size: 2.5rem;
      margin-bottom: 40px;
    }

    .btn-container {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      position: relative;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.008));
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 32px;
      padding: 18px 40px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      -webkit-backdrop-filter: blur(40px) saturate(200%) contrast(130%) brightness(110%);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3), inset 0 0 0.5px rgba(255, 255, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.02);
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      overflow: hidden;
      display: inline-block;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 100%;
      background: radial-gradient(ellipse at 60% 40%, rgba(255, 255, 255, 0.08), transparent 60%);
      mix-blend-mode: soft-light;
      pointer-events: none;
      z-index: 0;
    }

    .btn span {
      position: relative;
      z-index: 1;
    }

    .btn:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), inset 0 0 20px rgba(255, 255, 255, 0.04);
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.5) transparent;
    }

    *::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      border: 2px solid transparent; 
    }

    *::-webkit-scrollbar-thumb:hover {
      background-color: rgba(255, 255, 255, 0.7);
    }
  </style>

</head>
