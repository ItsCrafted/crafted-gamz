<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crafted Gamz Disabled</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="shortcut icon" href="favicon.png" type="image/x-icon">
<style>
:root {
  --dark-blue:#00ffe5;
  --blue:#4bf9ed;
  --light-blue:#96f3f5;
  --black:rgba(0,0,0,0.8);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body {
  font-family: Inter, sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  overflow:hidden;
  background:transparent;
}
.bg {
  position:fixed;
  inset:0;
  border:none;
  width:100%;
  height:100%;
  z-index:0;
}
.notice {
  position:relative;
  z-index:1;
  background:var(--black);
  border:1px solid var(--dark-blue);
  border-radius:16px;
  padding:40px;
  text-align:center;
  max-width:600px;
  box-shadow:0 0 40px rgba(0,255,229,0.15);
}
.notice i {
  font-size:52px;
  color:var(--dark-blue);
  margin-bottom:20px;
}
.notice h1 {
  font-size:28px;
  color:var(--light-blue);
  margin-bottom:16px;
}
.notice p {
  font-size:18px;
  line-height:1.5;
  color:rgba(255,255,255,0.85);
  min-height:70px;
  opacity:1;
  transition:opacity 1s ease;
}
</style>
<script src="status.js"></script>
</head>
<body>
  <iframe src="bg.html" class="bg"></iframe>

  <div class="notice">
    <i class="fa-solid fa-ban"></i>
    <h1>Crafted Gamz Disabled</h1>
    <p id="msg">You will now get insulated :D</p>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-app.js";
import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.6.0/firebase-firestore.js";

const messages = [
  "Nope. Not today.",
  "You thought. Sit back down.",
  "This page is closed. Your soul is crushed.",
  "Denied. Like, seriously.",
  "The answer is still no.",
  "Imagine thinking this would work.",
  "404: Your fun not found.",
  "Stop clicking. It's embarrassing.",
  "No entry. Don't even try.",
  "Crafted Gamz? Disabled. You? Blocked.",
  "Dream on.",
  "Access denied. Cope.",
  "Error: hope not found.",
  "Refresh all you want. Still no.",
  "Your persistence is tragic.",
  "Guess what? No.",
  "System says nope.",
  "This door is locked forever.",
  "You are not invited.",
  "Try harder. Actually, don't.",
  "This page has standards. You don't meet them.",
  "Go touch grass.",
  "Better luck never.",
  "What part of no is confusing?",
  "The fun is cancelled.",
  "User detected. Access revoked.",
  "Denied for style reasons.",
  "You failed the vibe check.",
  "Nope, nope, and… nope.",
  "Even the button gave up.",
  "Congratulations. Still no.",
  "Stop wasting your clicks.",
  "It's not broken. It's blocked.",
  "Look elsewhere, champ.",
  "Your patience isn't rewarded.",
  "Hope you like disappointment.",
  "You've reached the end of fun.",
  "Nothing to see here.",
  "Consider this your rejection letter.",
  "If persistence was cool, maybe.",
  "All roads lead to no.",
  "Keyboard warrior? Denied anyway.",
  "Try Ctrl+Alt+Del on your expectations.",
  "The ban hammer fell ages ago.",
  "This site owes you nothing.",
  "Come back never.",
  "Your session expired 10 minutes ago.",
  "This is a professional no.",
  "Congratulations: you lost.",
  "Don't take it personal. Or do.",
  "Blocked by popular demand.",
  "Still not happening."
]

const msgEl = document.getElementById("msg")

function cycle() {
  msgEl.style.opacity = 0
  setTimeout(() => {
    let randomIndex = Math.floor(Math.random() * messages.length)
    msgEl.textContent = messages[randomIndex]
    msgEl.style.opacity = 1
  }, 1000)
}

setInterval(cycle, 4000)

async function loadFirebaseConfig() {
  try {
    const res = await fetch('/.netlify/functions/get-firebase-config');
    if (!res.ok) throw new Error('Failed to fetch Firebase config');
    return await res.json();
  } catch (err) {
    console.error('Failed to load Firebase config:', err);
    return null;
  }
}

async function initDisableChecker() {
  try {
    const config = await loadFirebaseConfig();
    if (!config) {
      console.error('No Firebase config available');
      return;
    }

    const app = initializeApp(config);
    const db = getFirestore(app);
    const disableDoc = doc(db, "settings", "disable");

    onSnapshot(disableDoc, (snapshot) => {
      if (!snapshot.exists()) {
        console.log('Disable document not found - redirecting to main');
        window.location.href = '/main.html';
      } else {
        const data = snapshot.data();
        console.log('Disable document exists:', data);
      }
    }, (error) => {
      console.error("Error listening to disable document:", error);
    });
    
  } catch (err) {
    console.error("Failed to init disable checker:", err);
  }
}

initDisableChecker();
</script>
</body>
</html>
