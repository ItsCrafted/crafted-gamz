<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crafted Gamz Movies</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../css/movies.css">
  <script src="https://cdn.cgamz.online/brand.js"></script>
</head>
<body>
<div class="bg-container">
  <iframe src="../bg.html"></iframe>
</div>
<main id="main-content">
  <div class="page-header">
    <div class="page-header-icon"><i class="fa-solid fa-film"></i></div>
    <h1>Movies</h1>
  </div>
  <div class="search-wrap">
    <i class="fas fa-search"></i>
    <input type="text" id="movie-search" placeholder="Search all movies...">
  </div>
  <div class="filters" id="filters">
    <button class="cat-btn active" data-category="all">All</button>
    <button class="cat-btn" data-category="action">Action</button>
    <button class="cat-btn" data-category="comedy">Comedy</button>
    <button class="cat-btn" data-category="drama">Drama</button>
    <button class="cat-btn" data-category="horror">Horror</button>
    <button class="cat-btn" data-category="scifi">Sci-Fi</button>
    <button class="cat-btn" data-category="thriller">Thriller</button>
    <button class="cat-btn" data-category="animation">Animation</button>
  </div>
  <div id="movies-grid"></div>
  <button id="load-more-btn">Load More Movies</button>
</main>
<script src="../js/movies.js"></script>
</body>
</html>
