<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crafted Gamz Games</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../css/games.css">
</head>
<body>

<div class="page-header">
  <div class="header-top">
    <h1><i class="fa-solid fa-gamepad" style="color:var(--accent);margin-right:8px;font-size:18px"></i>Games</h1>
    <span class="game-count" id="game-count"></span>
  </div>

  <div class="search-row">
    <div class="search-wrap">
      <i class="fa-solid fa-magnifying-glass si"></i>
      <input id="search-input" type="text" placeholder="Search games…" autocomplete="off" spellcheck="false">
      <button class="search-clear" id="search-clear"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <button class="sort-btn" id="sort-btn">
      <i class="fa-solid fa-arrow-down-a-z" id="sort-icon"></i>
      <span id="sort-label">A–Z</span>
    </button>
  </div>

  <div class="filter-row" id="filter-row"></div>
</div>

<div class="search-meta" id="search-meta"></div>

<div class="games-scroll">
  <div class="games-grid" id="games-grid"></div>
</div>

<div class="game-view" id="game-view">
  <div class="game-toolbar-wrap">
    <div class="game-bubble">
      <button class="game-back" id="game-back" title="Back"><i class="fa-solid fa-arrow-left"></i></button>
    </div>
    <div class="game-bubble game-bubble-name" id="game-title"></div>
    <div class="game-bubble">
      <button class="game-action-btn" id="game-reload" title="Reload"><i class="fa-solid fa-rotate-right"></i></button>
    </div>
  </div>
  <div class="game-frame-wrap" id="game-frame-wrap">
    <iframe id="game-frame" allowfullscreen allow="fullscreen"></iframe>
  </div>
</div>
<script src="../js/games.js"></script>
</body>
</html>
