<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CG System Settings</title>
<style>
body{margin:0;background:#202124;color:#e8eaed;font-family:Arial,sans-serif;display:grid;place-items:center;height:100vh}
.card{background:#2b2d31;border:1px solid #3c4043;border-radius:12px;padding:24px;max-width:700px;width:min(92vw,700px)}
h1{margin:0 0 8px;font-size:28px}
p{margin:0 0 14px;color:#bdc1c6}
.row{padding:10px 0;border-top:1px solid #3c4043}
.row:first-of-type{border-top:none}
</style>
</head>
<body>
  <main class="card">
    <h1>System Settings</h1>
    <p>This is the local `cg://settings` page in `browser/pages/settings.html`.</p>
    <div class="row">Appearance</div>
    <div class="row">Privacy & Security</div>
    <div class="row">Proxy & Network</div>
  </main>
</body>
</html>
