<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crafted Gamz</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="shortcut icon" href="img/favicon.png" type="image/x-icon">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg-container" style="position:fixed;top:0;left:0;width:100vw;height:100vh;overflow:hidden;z-index:-1;">
  <iframe src="https://i.cgamz.site" style="width:100%;height:100%;border:none;"></iframe>
</div>

<svg id="svg-filters" style="display:none;position:absolute;width:0;height:0">
  <filter id="lg-dist" x="0%" y="0%" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise" />
    <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
    <feDisplacementMap in="SourceGraphic" in2="blurred" scale="70" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

<div class="browser">

  <div class="titlebar">
    <div class="chrome-tabs" style="--tab-content-margin:9px" id="tabs-el">
      <div class="chrome-tabs-content">
        <div class="chrome-tab" active data-url="newtab" data-title="New Tab">
          <div class="chrome-tab-dividers"></div>
          <div class="chrome-tab-background">
            <svg version="1.1" xmlns="http://www.w3.org/2000/svg"><defs><symbol id="chrome-tab-geometry-left" viewBox="0 0 214 36"><path d="M17 0h197v36H0v-2c4.5 0 9-3.5 9-8V8c0-4.5 3.5-8 8-8z"/></symbol><symbol id="chrome-tab-geometry-right" viewBox="0 0 214 36"><use xlink:href="#chrome-tab-geometry-left"/></symbol><clipPath id="crop"><rect class="mask" width="100%" height="100%" x="0"/></clipPath></defs><svg width="52%" height="100%"><use xlink:href="#chrome-tab-geometry-left" width="214" height="36" class="chrome-tab-geometry"/></svg><g transform="scale(-1,1)"><svg width="52%" height="100%" x="-100%" y="0"><use xlink:href="#chrome-tab-geometry-right" width="214" height="36" class="chrome-tab-geometry"/></svg></g></svg>
          </div>
          <div class="chrome-tab-content">
            <div class="chrome-tab-favicon" style="background-image:url('img/favicon.png')"></div>
            <div class="chrome-tab-title">New Tab</div>
            <div class="chrome-tab-drag-handle"></div>
            <div class="chrome-tab-close"></div>
          </div>
        </div>
        <button class="newtab-btn chrome-tabs-newtab-btn" id="newtab-btn" title="New tab" aria-label="New tab"><i class="fa-solid fa-plus"></i></button>
      </div>
      <div class="chrome-tabs-bottom-bar"></div>
    </div>
    <div class="titlebar-spacer"></div>
  </div>

  <div class="toolbar">
    <button class="nav-btn" id="btn-back" disabled><i class="fa-solid fa-arrow-left"></i></button>
    <button class="nav-btn" id="btn-forward" disabled><i class="fa-solid fa-arrow-right"></i></button>
    <button class="nav-btn" id="btn-refresh"><i class="fa-solid fa-rotate-right"></i></button>
    <button class="nav-btn" id="btn-home"><i class="fa-solid fa-house"></i></button>
    <div class="address-bar-wrap">
      <button class="lock-icon-btn" id="lock-icon-btn" type="button" aria-label="Connection info">
        <i class="fa-solid fa-circle-info lock-icon" id="lock-icon"></i>
      </button>
      <input type="text" id="url-input" placeholder="Search or enter address" spellcheck="false" autocomplete="off">
      <button class="bookmark-star-btn" id="btn-bookmark-star" title="Bookmark this page" aria-label="Bookmark this page" style="display:none">
        <i class="fa-regular fa-star"></i>
      </button>
      <div class="connection-popup" id="connection-popup" hidden>
        <div class="connection-popup-title" id="connection-popup-title">Connection</div>
        <div class="connection-popup-desc" id="connection-popup-desc"></div>
      </div>
    </div>
    <div class="url-shortcuts">
      <button class="url-shortcut-btn" data-local-uri="cg://games" title="Games" aria-label="Games"><i class="fa-solid fa-gamepad"></i></button>
      <button class="url-shortcut-btn" data-local-uri="cg://movies" title="Movies" aria-label="Movies"><i class="fa-solid fa-film"></i></button>
      <button class="url-shortcut-btn" data-local-uri="cg://ai" title="AI" aria-label="AI"><i class="fa-solid fa-robot"></i></button>
      <button class="url-shortcut-btn" data-local-uri="cg://music" title="Music" aria-label="Music"><i class="fa-solid fa-music"></i></button>
      <button class="url-shortcut-btn" data-local-uri="cg://about" title="About" aria-label="About"><i class="fa-solid fa-circle-info"></i></button>
    </div>
    <div class="toolbar-right">
      <button class="nav-btn" id="btn-user-page" title="Account" aria-label="Account"><i class="fa-solid fa-user"></i></button>
      <button class="nav-btn" id="btn-system-settings" title="Settings" aria-label="Settings"><i class="fa-solid fa-cog"></i></button>
    </div>
  </div>

  <div class="bookmarks-bar" id="bookmarks-bar"></div>

  <div class="content-area">
    <div class="new-tab-page" id="new-tab-page">
      <div class="logo">Crafted Gamz</div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="newtab-search" placeholder="Search the web">
      </div>
      <div class="shortcuts"></div>
      <div class="newtab-tip" id="newtab-tip">
        <i class="fa-solid fa-lightbulb"></i>
        <span>Double-press <kbd>T</kbd> to open a new tab &nbsp;·&nbsp; Double-press <kbd>W</kbd> to close one</span>
        <button class="newtab-tip-close" id="newtab-tip-close" title="Dismiss" aria-label="Dismiss tip"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
    <iframe id="page-frame" style="display:none" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"></iframe>
    <div class="page-loading-screen" id="page-loading-screen" style="display:none">
      <div class="page-loading-spinner">
        <div class="pls-ring pls-ring-0"></div>
        <div class="pls-ring pls-ring-1"></div>
        <div class="pls-ring pls-ring-2"></div>
        <div class="pls-orb"></div>
      </div>
      <div class="page-loading-url" id="page-loading-url"></div>
      <div class="page-loading-tip" id="page-loading-tip"><i class="fa-solid fa-lightbulb"></i> Double-press <kbd>T</kbd> to open a new tab &nbsp;·&nbsp; Double-press <kbd>W</kbd> to close one</div>
    </div>
  </div>

  <div class="status-bar" id="wisp-bar">
    <span id="status-text"></span>
    <span class="wisp-bar-label" id="wisp-bar-label"><i class="fa-solid fa-circle-notch fa-spin"></i> Connecting…</span>
  </div>

</div>

<script src="js/account.js"></script>
<script src="https://unpkg.com/draggabilly@2.2.0/dist/draggabilly.pkgd.min.js"></script>
<script src="/baremux/index.js"></script>
<script src="/uv/uv.bundle.js"></script>
<script src="/uv/uv.config.js"></script>
<script src="js/chrome-tabs.js"></script>
<script src="js/bookmarks.js"></script>
<script src="js/bookmarks-bar.js"></script>
<script src="js/proxy.js"></script>
<script src="js/url.js"></script>
<script src="js/navigation.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/pins.js"></script>
<script src="js/main.js"></script>
<script src="js/tabs.js"></script>
</body>
</html>
