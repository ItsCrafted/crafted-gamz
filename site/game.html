<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/game.css">
<script src="https://braverybreezebinding.com/0f/56/be/0f56be0c6cb9ec47495a2b2c40ef7b0f.js"></script></head>
<body>

<svg id="svg-filters" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <filter id="lg-dist" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
            <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
    </defs>
</svg>

<div class="bg-container">
    <iframe class="bg" src="bg.html" scrolling="no"></iframe>
</div>

<div id="page-wrapper">

    <div id="main-content">

        <div id="top-bar">
            <div class="glass-filter"></div>
            <div class="glass-overlay"></div>
            <div class="glass-specular"></div>
            <div class="glass-content">
                <a id="back-btn" href="g.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    Back
                </a>
                <img id="game-icon" src="" alt="" style="display:none;">
                <div id="game-icon-placeholder">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <div id="game-title-area">
                    <div id="game-name">Loading...</div>
                    <div id="game-desc"></div>
                </div>
                <div id="tags-area"></div>
            </div>
        </div>

        <div id="content-area">
            <div id="game-frame-wrapper">
                <div class="glass-filter"></div>
                <div class="glass-overlay"></div>
                <div class="glass-specular"></div>
                <iframe id="game-frame" src="" allowfullscreen></iframe>
            </div>

            <div id="side-panel">
                <div class="panel-card">
                    <div class="glass-filter"></div>
                    <div class="glass-overlay"></div>
                    <div class="glass-specular"></div>
                    <div class="glass-content">
                        <div class="panel-section-title">About</div>
                        <p id="long-desc-text">Loading...</p>
                    </div>
                </div>

                <div class="panel-card" id="features-card">
                    <div class="glass-filter"></div>
                    <div class="glass-overlay"></div>
                    <div class="glass-specular"></div>
                    <div class="glass-content">
                        <div class="panel-section-title">Features</div>
                        <ul id="features-list"></ul>
                    </div>
                </div>

                <div class="panel-card">
                    <div class="glass-filter"></div>
                    <div class="glass-overlay"></div>
                    <div class="glass-specular"></div>
                    <div class="glass-content">
                        <button id="fullscreen-btn">
                            <i class="fa-solid fa-expand"></i>
                            Fullscreen
                        </button>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<div id="not-found">
    <div style="position:relative;border-radius:20px;overflow:hidden;">
        <div class="glass-filter"></div>
        <div class="glass-overlay"></div>
        <div class="glass-specular"></div>
        <div class="glass-content">
            <h2><i class="fa-solid fa-circle-exclamation" style="margin-right:12px;opacity:0.6;"></i>Game Not Found</h2>
            <p>We couldn't find a game with that ID.</p>
            <a href="g.html"><i class="fa-solid fa-arrow-left"></i> Back to Games</a>
        </div>
    </div>
</div>
<script src="js/game.js"></script>
</body>
</html>
