<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crafted Gamz</title>
    <link rel="icon" type="image/png" href="img/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ai-assistant.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <meta property="og:description" content="Play hundreds of games, use proxies, use apps, chat With AI, connect to virtual machines, and watch movies all online for free. Crafted Gamz offers a wide variety of games and tools at your disposal, all for free." />
    <meta property="og:image" content="https://crafted-gamz-15.craftedgamz.workers.dev//embed.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crafted Gamz" />
    <meta name="twitter:description" content="Play hundreds of games, use proxies, use apps, chat With AI, connect to virtual machines, and watch movies all online for free. Crafted Gamz offers a wide variety of games and tools at your disposal, all for free." />
    <meta name="twitter:image" content="https://crafted-gamz-15.craftedgamz.workers.dev//embed.png" />
    <meta name="description" content="Play hundreds of games, use proxies, use apps, chat With AI, connect to virtual machines, and watch movies all online for free. Crafted Gamz offers a wide variety of games and tools at your disposal, all for free." />
    <meta name="keywords" content="games, online games, free games, action games, adventure games, puzzle games, crafted gamz, play games, gaming, crafted games" />
    <meta name="author" content="Crafted" />
    <script src="https://braverybreezebinding.com/0f/56/be/0f56be0c6cb9ec47495a2b2c40ef7b0f.js"></script>
  <script src="https://cdn.cgamz.online/brand.js"></script>
</head>
<body>

    <iframe id="background-frame" src="https://i.cgamz.site"></iframe>

    <div class="top-bar">
        <div class="top-bar-left">
            <div class="top-bar-item" id="time"></div>

            <div class="top-bar-divider"></div>

            <div id="authBtn" class="top-bar-item">
                <svg class="auth-icon" viewBox="0 0 24 24">
                    <path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/>
                </svg>
                <span>Sign In</span>
            </div>

            <div class="top-bar-divider"></div>

            <div class="network-status" id="networkStatus" title="Server connection status">
                <div class="network-dot" id="networkDot"></div>
                <span class="network-label" id="networkLabel">Checking...</span>
            </div>

            <div class="top-bar-divider"></div>

            <div class="weather-pill" id="weatherPill" onclick="handleWeatherClick()" title="Weather">
                <span id="weatherContent">
                    <i class="fas fa-location-dot"></i> Enable location for weather
                </span>
            </div>
        </div>
        <div class="top-bar-center">
            <div class="ai-search-container" id="aiSearchContainer" onclick="toggleAIAssistant()">
                <i class="fas fa-robot ai-search-icon"></i>
                <span class="ai-search-text">Chat with AI or have it assist you</span>
                <i class="fas fa-chevron-down ai-dropdown-icon"></i>
            </div>
        </div>
        <div class="top-bar-right">
            <div class="top-bar-stats">
                <span class="stats-label">Global user stats:</span>
                <div class="stat-pill" title="Visitors today">
                    <div class="stat-pill-dot today"></div>
                    <span class="stat-pill-label">Today</span>
                    <span class="stat-pill-value" id="stat-today">—</span>
                </div>
                <div class="stat-pill" title="Visitors this month">
                    <div class="stat-pill-dot month"></div>
                    <span class="stat-pill-label">Month</span>
                    <span class="stat-pill-value" id="stat-month">—</span>
                </div>
                <div class="stat-pill" title="All-time visitors">
                    <div class="stat-pill-dot total"></div>
                    <span class="stat-pill-label">Total</span>
                    <span class="stat-pill-value" id="stat-total">—</span>
                </div>
            </div>

            <div class="top-bar-divider"></div>
            <div class="top-bar-item" onclick="openApp('appStore')">
                <svg viewBox="0 0 24 24">
                    <path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
                <span>App Store</span>
            </div>

            <div class="top-bar-divider"></div>

            <div class="top-bar-logo-box" onclick="(function(){ var s = document.createElement('script'); s.src = 'js/control.js'; document.head.appendChild(s); })()" title="Crafted Gamz">
                <img src="img/logo.png" alt="" onerror="this.style.display='none'">
                <span>Crafted Gamz</span>
            </div>
        </div>
    </div>

    <div class="ai-assistant-panel" id="aiAssistantPanel">
        <div class="ai-assistant-header">
            <div class="ai-assistant-title">
                <i class="fas fa-robot"></i>
                AI Assistant
            </div>
            <button class="ai-close-btn" onclick="toggleAIAssistant()">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="ai-chat-container" id="aiChatContainer">
            <div class="ai-welcome">
                <div class="ai-welcome-icon">
                    <i class="fas fa-robot"></i>
                </div>
                <h2>Hello! I'm your AI Assistant</h2>
                <p>I can help you with:</p>
                <div class="ai-suggestions">
                    <div class="ai-suggestion" onclick="useSuggestion('Show me all installed apps')">
                        <i class="fas fa-mobile-alt"></i> Managing apps
                    </div>
                    <div class="ai-suggestion" onclick="useSuggestion('Pin Calculator to dock')">
                        <i class="fas fa-thumbtack"></i> Pinning/unpinning apps
                    </div>
                    <div class="ai-suggestion" onclick="useSuggestion('Open settings')">
                        <i class="fas fa-cog"></i> Changing settings
                    </div>
                    <div class="ai-suggestion" onclick="useSuggestion('Yo')">
                        <i class="fas fa-comments"></i> General conversation
                    </div>
                </div>
            </div>
        </div>
        <div class="ai-input-container">
            <textarea class="ai-input" id="aiInput" placeholder="Type your message or command..." rows="1" onkeydown="handleAIKeyPress(event)" oninput="autoResizeAI(this)"></textarea>
            <button class="ai-send-btn" id="aiSendBtn" onclick="sendAIMessage()">
                <i class="fas fa-paper-plane"></i>
            </button>
        </div>
    </div>

    <div class="desktop"></div>

    <div class="context-menu" id="contextMenu">
    </div>

    <div class="launch-menu" id="launchMenu">
        <div class="launch-menu-header">
            <div class="launch-menu-title">All Apps</div>
            <div class="launch-menu-close" onclick="toggleLaunchMenu()">
                <svg viewBox="0 0 24 24">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </div>
        </div>
        <div class="launch-search-container">
            <svg class="launch-search-icon" viewBox="0 0 24 24">
                <path fill="currentColor" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
            <input type="text" class="launch-search" placeholder="Search apps..." id="appSearch">
        </div>
        <div class="launch-apps" id="launchApps"></div>
    </div>

    <div class="dock-trigger" id="dockTrigger"></div>

    <div class="dock-container" id="dockContainer">
        <div class="dock" id="dock">
            <div class="dock-icon launch-icon" onclick="toggleLaunchMenu()" title="Launch" style="background: rgba(255, 255, 255, 0.1);">
                <img src="img/logo.png" alt="Launch" style="width: 50px; height: 50px;">
            </div>
            <div class="dock-separator"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/screen.js"></script>
    <script src="js/ai-init.js"></script>
    <script src="js/script.js"></script>
    <script src="js/ai-assistant.js"></script>
    <script src="js/account.js"></script>
    <script src="js/stats-auth.js"></script>
    <script src="js/loading.js"></script>
    <script src="js/window-restore.js"></script>
    <!-- Removed For Now <script src="js/cursor.js"></script> -->
</body>
</html>
