<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/store.css">
  <script src="https://cdn.cgamz.online/brand.js"></script>
</head>
<body>

    <nav class="nav">
        <span class="nav-brand" onclick="showHomePage()">crafted_gamz<span class="blink">_</span></span>
        <div class="nav-center" id="navItems">
            <span class="nav-item active" data-category="all">all</span>
        </div>
        <div class="nav-search">
            <span class="prompt-char">&gt;</span>
            <input type="text" class="nav-search-input" placeholder="search..." id="navSearchInput">
        </div>
    </nav>

    <div class="content">

        <header class="hero" id="heroBlock">
            <div class="hero-comment">CRAFTED GAMZ 15 APP INSTALLER</div>
            <h1 class="hero-title">app<br><em>store.</em></h1>
            <div class="hero-input-row">
                <span class="prompt-char">&gt;&nbsp;</span>
                <input type="text" class="hero-input" placeholder="search applications..." id="searchInput">
            </div>
        </header>

        <div class="icon-carousel" id="iconCarousel" style="display:none;">
            <div class="icon-carousel-track forward" id="iconCarouselTrack1"></div>
            <div class="icon-carousel-track reverse" id="iconCarouselTrack2"></div>
        </div>

        <div class="toolbar">
            <div class="toolbar-left" id="filterPills">
                <button class="pill active" data-filter="all">all</button>
            </div>
            <div class="toolbar-right" id="filterCount"></div>
        </div>

        <div class="app-list" id="appGrid"></div>

    </div>

    <div class="overlay" id="detailView">
        <div class="drawer">
            <div class="drawer-topbar">
                <span class="drawer-crumb" id="detailCategory">application</span>
                <button class="drawer-close" onclick="closeDetail()">[ esc ]</button>
            </div>
            <div class="drawer-hero">
                <img id="detailIcon" class="drawer-icon" src="" alt="">
                <div class="drawer-info">
                    <h2 class="drawer-title" id="detailTitle"></h2>
                    <p class="drawer-subdesc" id="detailDescription"></p>
                    <div class="drawer-btns">
                        <button class="btn-get" id="detailInstallBtn">get</button>
                        <button class="btn-open" id="detailOpenBtn" style="display:none;">open</button>
                    </div>
                </div>
            </div>
            <div class="drawer-rule"></div>
            <div class="drawer-cols">
                <div class="drawer-col">
                    <div class="col-label">About</div>
                    <p id="detailAbout"></p>
                </div>
                <div class="drawer-col">
                    <div class="col-label">Features</div>
                    <ul id="detailFeatures"></ul>
                    <div class="col-label" style="margin-top:24px;">Tags</div>
                    <div class="tag-group" id="detailTags"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/store.js"></script>
</body>
</html>
