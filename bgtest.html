<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Realistic Starfield Warp Tunnel Improved</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    z-index: -1;
    background: black;
  }
</style>
<script src="status.js"></script>
</head>
<body>
<canvas id="starfield"></canvas>
<script>
(() => {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let w, h, cx, cy;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cx = w / 2;
    cy = h / 2;
  }
  window.addEventListener('resize', resize);
  resize();

  
  function randomCirclePoint(r) {
    const t = 2 * Math.PI * Math.random();
    const u = Math.random() + Math.random();
    const radius = u > 1 ? 2 - u : u; 
    return {
      x: Math.cos(t) * radius * r,
      y: Math.sin(t) * radius * r
    };
  }

  class Star {
    constructor() {
      this.reset();
    }
    reset() {
      let pos = randomCirclePoint(w);
      this.x = pos.x;
      this.y = pos.y;
      this.z = Math.random() * w;
      this.pz = this.z;
      this.brightness = 0.5 + Math.random() * 0.5;
    }
    update(speed) {
      this.pz = this.z;
      this.z -= speed;
      if (this.z <= 1) this.reset();
    }
    draw(ctx) {
      const sx = cx + (this.x / this.z) * cx;
      const sy = cy + (this.y / this.z) * cy;

      const px = cx + (this.x / this.pz) * cx;
      const py = cy + (this.y / this.pz) * cy;

      const size = (1 - this.z / w) * 3 + 0.5;

      if (
        sx < 0 || sx > w ||
        sy < 0 || sy > h
      ) return; 

      
      ctx.strokeStyle = `rgba(150, 243, 245, ${this.brightness})`;
      ctx.lineWidth = size;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(sx, sy);
      ctx.stroke();

      
      const gradient = ctx.createRadialGradient(sx, sy, 0, sx, sy, size*2);
      gradient.addColorStop(0, `rgba(150, 243, 245, ${this.brightness})`);
      gradient.addColorStop(0.5, `rgba(150, 243, 245, ${this.brightness * 0.2})`);
      gradient.addColorStop(1, 'rgba(150, 243, 245, 0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(sx, sy, size*2, 0, Math.PI*2);
      ctx.fill();
    }
  }

  const starsCount = 50000;
  const stars = [];
  for(let i = 0; i < starsCount; i++) stars.push(new Star());

  let speed = 100;

  function animate() {
    
    ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
    ctx.fillRect(0, 0, w, h);

    
    let grad = ctx.createRadialGradient(cx, cy, cx * 0.6, cx, cy, cx);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.7)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);

    stars.forEach(star => {
      star.update(speed);
      star.draw(ctx);
    });

    requestAnimationFrame(animate);
  }

  animate();
})();
</script>
</body>
</html>
