<!DOCTYPE html>
<html>
<head>
  <title>Decode Project Viewer</title>
  <style>
    body { background: black; color: white; font-family: sans-serif; }
    iframe { width: 100vw; height: 90vh; border: none; background: white; }
  </style>
<script src="status.js"></script>
</head>
<body>
  <h2>Upload Encoded Project</h2>
  <input type="file" id="txtFile" accept=".txt">
  <iframe id="viewer"></iframe>

  <script>
    const files = {};

    function parseEncodedProject(text) {
      const parts = text.split(/\[\[(.*?)\]\]/g).filter(Boolean);
      for (let i = 0; i < parts.length; i += 2) {
        const filename = parts[i].trim();
        const content = atob(parts[i + 1].replace(/\s+/g, ''));
        files[filename] = content;
      }
    }

    function rewriteHTML(html, currentPath) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(html, "text/html");

      const rewrite = (tag, attr) => {
        doc.querySelectorAll(tag).forEach(el => {
          const original = el.getAttribute(attr);
          if (!original || original.startsWith("http") || original.startsWith("data:")) return;
          const resolved = new URL(original, 'file://' + currentPath).pathname.slice(1);
          if (files[resolved]) {
            const mime = getMimeType(resolved);
            el.setAttribute(attr, `data:${mime};base64,${btoa(files[resolved])}`);
          }
        });
      };

      rewrite("script", "src");
      rewrite("link", "href");
      rewrite("img", "src");
      rewrite("a", "href");

      return "<!DOCTYPE html>\n" + doc.documentElement.outerHTML;
    }

    function getMimeType(name) {
      const ext = name.split('.').pop().toLowerCase();
      return {
        html: 'text/html',
        js: 'application/javascript',
        css: 'text/css',
        png: 'image/png',
        jpg: 'image/jpeg',
        jpeg: 'image/jpeg',
        gif: 'image/gif',
        svg: 'image/svg+xml'
      }[ext] || 'text/plain';
    }

    document.getElementById("txtFile").onchange = async function () {
      const file = this.files[0];
      if (!file) return alert("No file selected");
      try {
        const text = await file.text();
        parseEncodedProject(text);

        const iframe = document.getElementById("viewer");
        const raw = files["index.html"];
        if (!raw) return alert("Missing index.html");
        const rewritten = rewriteHTML(raw, "index.html");

        const blob = new Blob([rewritten], { type: "text/html" });
        iframe.src = URL.createObjectURL(blob);
      } catch (e) {
        console.error(e);
        alert("Error reading file.");
      }
    };
  </script>
</body>
</html>
