<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="favicon.png" />
  <title>Crafted Gamz | Search Browser</title>
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: transparent !important;
      overflow: hidden;
      font-family: sans-serif;
    }

    #bg-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    #bg-container iframe {
      width: 100%; height: 100%;
      border: none;
      background: transparent;
      filter: brightness(0.7);
    }

    nav {
      background: rgba(0, 0, 0, 0.6) !important;
      backdrop-filter: blur(8px);
    }

    #tab-bar {
      position: fixed;
      top: 64px; left: 0; right: 0; height: 36px;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 998;
      display: flex; align-items: center;
      padding: 0 10px;
      border-bottom: 1px solid rgba(75, 249, 237, 0.3);
      overflow-x: auto; white-space: nowrap;
    }

    .tab {
      background: rgba(34,34,34,0.8);
      color: #fff;
      border-radius: 4px 4px 0 0;
      padding: 6px 12px;
      margin-right: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between; 
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
      min-width: 80px;
      max-width: 200px;
      overflow: hidden;
    }

    .tab.active {
      background: rgba(75,249,237,0.9);
      color: #000; font-weight: bold;
    }
    .tab .close-btn { margin-left:8px; color:#888; }
    .tab .close-btn:hover { color:#000; }
    #add-tab-btn { color:#4bf9ed; font-size:20px; cursor:pointer; }

    #iframe-container {
      position: fixed;
      top: 100px; bottom: 0; left: 0; right: 0;
      background: transparent !important;
      z-index: 1;
    }
    #iframe-container iframe {
      width: 100%; height: 100%;
      border: none;
      background: transparent !important;
      display: none;
    }
    #iframe-container iframe.active {
      display: block;
    }

    .loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      font-size: 18px;
      color: #4bf9ed;
      text-align: center;
    }

    .error {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      font-size: 18px;
      color: #ff6b6b;
      text-align: center;
      padding: 20px;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #00ffe5 transparent;
    }

    *::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    *::-webkit-scrollbar-track {
      background: transparent;
    }

    *::-webkit-scrollbar-thumb {
      background-color: #00ffe5;
      border-radius: 10px;
      border: 2px solid transparent; 
    }

  </style>
</head>
<body>

  <div id="bg-container">
    <iframe src="./bg.html" aria-hidden="true" tabindex="-1"></iframe>
  </div>

  <div id="loading" class="loading">
    <i class="fas fa-spinner fa-spin"></i><br>
    Loading Search Browser...
  </div>
  
  <div id="error" class="error" style="display: none;">
    <i class="fas fa-exclamation-triangle"></i><br>
    Failed to load the search browser.<br>
    <small>Please try refreshing the page.</small>
  </div>

  <div id="tab-bar" style="display: none;">
    <div class="tab active" data-id="tab1" title="Search">
      Search <span class="close-btn">&times;</span>
    </div>
    <div id="add-tab-btn" title="New Tab">+</div>
  </div>

  <div id="iframe-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/js/all.min.js"></script>
  <script src="periodSchedule.js"></script>
  <script src="nav.js" defer></script>
<script type="module" src="reload.js"></script>
<script type="module" src="disable.js"></script>
<script type="module" src="notification.js"></script>
<script type="module" src="maintenance.js"></script>


  <script>
    let searchUrl = null;
    let tabCount = 1;

    async function getSearchUrl() {
      try {
        const response = await fetch('/.netlify/functions/get-search-url');
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        
        const data = await response.json();
        
        if (!data.url) {
          throw new Error('No URL returned from function');
        }
        
        return data.url;
        
      } catch (error) {
        console.error('Error getting search URL:', error);
        throw error;
      }
    }

    async function initializeBrowser() {
      try {
        searchUrl = await getSearchUrl();
        
        document.getElementById('loading').style.display = 'none';
        
        document.getElementById('tab-bar').style.display = 'flex';
        
        createInitialTab();
        
        setupEventListeners();
        
      } catch (error) {
        console.error('Error initializing browser:', error);
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'block';
      }
    }

    function createInitialTab() {
      const iframe = document.createElement('iframe');
      iframe.src = searchUrl;
      iframe.dataset.id = 'tab1';
      iframe.className = 'active';
      iframe.title = 'Search';
      document.getElementById('iframe-container').appendChild(iframe);
    }

    function setupEventListeners() {
      const tabBar = document.getElementById('tab-bar');
      const addTabBtn = document.getElementById('add-tab-btn');

      tabBar.addEventListener('click', e => {
        if (e.target.classList.contains('close-btn')) {
          const tab = e.target.parentNode, id = tab.dataset.id;
          document.querySelector(`.tab[data-id="${id}"]`)?.remove();
          document.querySelector(`#iframe-container iframe[data-id="${id}"]`)?.remove();
          if (tab.classList.contains('active')) {
            const last = document.querySelectorAll('.tab');
            if (last.length) activateTab(last[last.length - 1].dataset.id);
          }
        } else if (e.target.classList.contains('tab')) {
          activateTab(e.target.dataset.id);
        }
      });

      addTabBtn.addEventListener('click', () => createTab());
    }

    function activateTab(id) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('#iframe-container iframe').forEach(f => f.classList.remove('active'));
      document.querySelector(`.tab[data-id="${id}"]`)?.classList.add('active');
      document.querySelector(`#iframe-container iframe[data-id="${id}"]`)?.classList.add('active');
    }

    function createTab(url = null) {
      if (!searchUrl) return;
      
      tabCount++;
      const id = 'tab' + tabCount;
      
      const tab = document.createElement('div');
      tab.className = 'tab';
      tab.dataset.id = id;
      tab.innerHTML = `Tab <span class="close-btn">&times;</span>`;
      document.getElementById('tab-bar').insertBefore(tab, document.getElementById('add-tab-btn'));

      const iframe = document.createElement('iframe');
      iframe.src = url || searchUrl;
      iframe.dataset.id = id;
      iframe.title = `Tab ${tabCount}`;
      document.getElementById('iframe-container').appendChild(iframe);

      activateTab(id);
    }

    window.addEventListener('DOMContentLoaded', initializeBrowser);
  </script>
</body>
</html>
