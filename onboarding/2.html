<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crafted Gamz: Browser</title>
  <link rel="stylesheet" href="../css/onboarding.css">
<link rel="shortcut icon" href="../img/icon.png" type="image/x-icon">
  <script src="https://cdn.cgamz.online/brand.js"></script>
</head>
<body>
  <div class="bg-container">
    <iframe src="../bg.html" title="Background"></iframe>
  </div>
  <div class="shell">

    <header class="topbar">
      <span class="logo">Crafted <span>Gamz</span></span>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="step-indicator">
          <div class="step-pip done"></div>
          <div class="step-pip active"></div>
          <div class="step-pip"></div>
          <div class="step-pip"></div>
          <div class="step-pip"></div>
        </div>
        <span class="step-label">02 / 05</span>
      </div>
    </header>

    <main class="main">
      <div class="card">

        <div class="card-eyebrow">Browser</div>
        <h1 class="card-title">Browser mode</h1>
        <p class="card-sub">Crafted Gamz now uses the browser layout only. Continue to keep setup moving.</p>

        <div class="error-msg" id="error-msg"></div>

        <div class="action-row">
          <button class="btn btn-ghost" onclick="window.location.href='1.html'">Back</button>
          <button class="btn btn-primary" id="next-btn">Continue</button>
        </div>

      </div>
    </main>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../js/2.js"></script>
</body>
</html>
