<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crafted Gamz: Account</title>
  <link rel="stylesheet" href="../css/onboarding.css">
<link rel="shortcut icon" href="../img/icon.png" type="image/x-icon">
  <script src="https://cdn.cgamz.online/brand.js"></script>
  <script src="../js/intro.js" defer></script>
</head>
<body>
  <div class="bg-container">
    <iframe src="../bg.html" title="Background"></iframe>
  </div>
  <div class="shell">

    <header class="topbar">
      <span class="logo">Crafted <span>Gamz</span></span>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="step-indicator">
          <div class="step-pip active"></div>
          <div class="step-pip"></div>
          <div class="step-pip"></div>
          <div class="step-pip"></div>
          <div class="step-pip"></div>
        </div>
        <span class="step-label">01 / 05</span>
      </div>
    </header>

    <main class="main">
      <div class="card" id="card">

        <div class="card-eyebrow">Getting started</div>
        <h1 class="card-title">Your account</h1>
        <p class="card-sub">Sign in to save your progress across devices.</p>

        <div id="name-field" class="field" style="display:none;">
          <label>Display name</label>
          <input type="text" id="name-input" placeholder="what should we call you?" maxlength="32">
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" id="email-input" placeholder="you@example.com">
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" id="password-input" placeholder="••••••••">
        </div>

        <div class="error-msg" id="error-msg"></div>

        <button class="btn btn-primary btn-full" id="submit-btn">Sign In</button>
        <button class="toggle-link" id="toggle-btn" onclick="window.location.href='https://cloud.craftedgamz.com'">Don't have an account? Create one on ccloud</button>

      </div>
    </main>

  </div>

  <script src="../js/ccloud-client.js"></script>
  <script src="../js/user-stats.js"></script>
  <script src="../js/1.js"></script>
</body>
</html>
