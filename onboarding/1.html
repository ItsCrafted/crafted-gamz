<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crafted Gamz: Account</title>
  <link rel="stylesheet" href="../css/onboarding.css">
<link rel="shortcut icon" href="../img/icon.png" type="image/x-icon">
  <script src="https://cdn.cgamz.online/brand.js"></script>
  <script src="../js/intro.js" defer></script>
</head>
<body>
  <div class="bg-container">
    <iframe src="../bg.html" title="Background"></iframe>
  </div>
  <div class="shell">

    <header class="topbar">
      <span class="logo">Crafted <span>Gamz</span></span>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="step-indicator">
          <div class="step-pip active"></div>
          <div class="step-pip"></div>
          <div class="step-pip"></div>
          <div class="step-pip"></div>
          <div class="step-pip"></div>
        </div>
        <span class="step-label">01 / 05</span>
      </div>
    </header>

    <main class="main">
      <div class="card" id="card">

        <div class="card-eyebrow">Getting started</div>
        <h1 class="card-title">Your account</h1>
        <p class="card-sub">Sign in or create an account to save your progress across devices.</p>

        <div style="display:flex;flex-direction:column;gap:10px;">
          <button class="btn btn-oauth" id="google-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
            </svg>
            Continue with Google
          </button>
          <button class="btn btn-oauth" id="github-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
            Continue with GitHub
          </button>
        </div>

        <div class="or-sep"><span>or</span></div>

        <div id="name-field" class="field" style="display:none;">
          <label>Display name</label>
          <input type="text" id="name-input" placeholder="what should we call you?" maxlength="32">
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" id="email-input" placeholder="you@example.com">
        </div>

        <div class="field">
          <label>Password</label>
          <input type="password" id="password-input" placeholder="••••••••">
        </div>

        <div class="error-msg" id="error-msg"></div>

        <button class="btn btn-primary btn-full" id="submit-btn">Sign In</button>
        <button class="toggle-link" id="toggle-btn">Don't have an account? Sign up</button>

      </div>
    </main>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../js/user-stats.js"></script>
  <script src="../js/1.js"></script>
</body>
</html>
