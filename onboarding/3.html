<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crafted Gamz: Your Name</title>
  <link rel="stylesheet" href="../css/onboarding.css">
<link rel="shortcut icon" href="../img/icon.png" type="image/x-icon">
  <script src="https://cdn.cgamz.online/brand.js"></script>
</head>
<body>
  <div class="bg-container">
    <iframe src="../bg.html" title="Background"></iframe>
  </div>
  <div class="shell">

    <header class="topbar">
      <span class="logo">Crafted <span>Gamz</span></span>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="step-indicator">
          <div class="step-pip done"></div>
          <div class="step-pip done"></div>
          <div class="step-pip active"></div>
          <div class="step-pip"></div>
          <div class="step-pip"></div>
        </div>
        <span class="step-label">03 / 05</span>
      </div>
    </header>

    <main class="main">
      <div class="card">

        <div class="card-eyebrow">Identity</div>
        <h1 class="card-title">What do we call you?</h1>
        <p class="card-sub">Your display name is how others see you. Make it yours.</p>

        <div class="field">
          <label>Display name</label>
          <input
            type="text"
            id="name-input"
            placeholder="GhostRunner99"
            maxlength="32"
            autocomplete="off"
            spellcheck="false"
          >
          <div class="char-count"><span id="char-count">0</span> / 32</div>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <div class="action-row">
          <button class="btn btn-ghost" onclick="window.location.href='2.html'">Back</button>
          <button class="btn btn-primary" id="next-btn">Continue</button>
        </div>

      </div>
    </main>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="../js/3.js"></script>
</body>
</html>
