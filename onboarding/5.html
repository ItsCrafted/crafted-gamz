<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crafted Gamz: Let's Go</title>
  <link rel="stylesheet" href="../css/onboarding.css">
<link rel="shortcut icon" href="../img/icon.png" type="image/x-icon">
  <link rel="stylesheet" href="../css/5.css">
  <script src="https://cdn.cgamz.online/brand.js"></script>
</head>
<body>
  <div class="bg-container">
    <iframe src="../bg.html" title="Background"></iframe>
  </div>
  <div class="shell">

    <header class="topbar">
      <span class="logo">Crafted <span>Gamz</span></span>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="step-indicator">
          <div class="step-pip done"></div>
          <div class="step-pip done"></div>
          <div class="step-pip done"></div>
          <div class="step-pip done"></div>
          <div class="step-pip active"></div>
        </div>
        <span class="step-label">05 / 05</span>
      </div>
    </header>

    <main class="main">
      <div class="card">

        <div class="name-greeting" id="greeting"></div>
        <div class="card-eyebrow">You're all set</div>

        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>

        <h1 class="card-title">Let's go.</h1>
        <div class="accent-line"></div>

        <p class="card-sub">Everything's ready. Your progress syncs automatically across devices whenever you're signed in.</p>

        <div class="env-badge" id="env-badge">
          <div class="env-badge-dot"></div>
          <span id="env-label">loading…</span>
        </div>

        <div class="launch-btn-wrap">
          <button class="btn btn-primary large" id="launch-btn">Enter Crafted Gamz</button>
        </div>

      </div>
    </main>

  </div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/5.js"></script>
</body>
</html>
